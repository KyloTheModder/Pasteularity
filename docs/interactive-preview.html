function field(id, label, value, input, o = {}) {

function setting(title, desc, value, controls = "") {

function stateView(ic, title, msg, action = "") {

const loadingView = l => `<div class="loading-state"><span class="spin"></span>${esc(l)}</div>`;

let snackTimer;
function snack(text, err) { S.snack = { text, err }; clearTimeout(snackTimer); snackTimer = setTimeout(() => { S.snack = null; render(); }, 3200); render(); }
const ok = t => snack(t, false), fail = t => snack(t, true);
const confirmDlg = (title, message, confirm, onOk, danger = true) => { S.dialogs.push({ type: "confirm", title, message, confirm, onOk, danger }); render(); };
const inputDlg = (title, label, confirm, onOk, initial = "", validate = () => null) => { S.dialogs.push({ type: "input", title, label, confirm, onOk, value: initial, validate }); render(); };

/* ---------- Views ---------- */

}
function shellView() {

function notConnected(st) {

    paired ? "Check that Wireless debugging is on and the headset is on Wi-Fi." : "This screen needs shell access. Pairing takes about two minutes.",
    paired ? btn("Reconnect", "reconnect", { style: "primary" }) : btn("Start setup", "openSetup", { style: "primary" }));
}

    ${o.error ? `<div class="body-l err">${esc(o.error)}</div>` : ""}

}
function termView() {

function fileIcon(e) {
  if (e.isDir) return "folder";
  const x = e.name.split(".").pop().toLowerCase();
  return { apk: "android", obb: "inventory_2", png: "image", jpg: "image", jpeg: "image", webp: "image", mp4: "movie", mkv: "movie", webm: "movie" }[x] || "description";
}
function sortEntries(list, key, asc, filter, hidden) {
  const by = { Name: (a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()), Size: (a, b) => a.size - b.size, Date: (a, b) => a.t - b.t }[key];
  return list.filter(e => hidden || !e.name.startsWith(".")).filter(e => !filter.trim() || e.name.toLowerCase().includes(filter.trim().toLowerCase()))
    .sort((a, b) => (b.isDir - a.isDir) || (asc ? by(a, b) : by(b, a)));
}
function opBar() {
  const op = S.files.op;
  if (!op) return "";
  const pct = op.progress != null ? ` ${Math.floor(op.progress * 100)}%` : "";
  return `<span class="label">${esc(op.label + pct)}</span><div class="track ${op.progress == null ? "indef" : ""}"><i style="${op.progress != null ? `width:${op.progress * 100}%` : ""}"></i></div>${btn("Cancel", "opCancel", { style: "quiet" })}`;
}
function filesView() {
  const f = S.files;
  const places = [["Internal storage", "/sdcard", "sd_card"], ["Downloads", DL, "download"], ["OBB", OBB, "inventory_2"], ["App data", DATA, "storage"]];
  const parts = f.path.split("/").filter(Boolean);
  let acc = "";
  const crumbs = [["/", "/"], ...parts.map(p => { acc += "/" + p; return [p, acc]; })];
  const crumbHtml = crumbs.map(([l, p], i) => `<button type="button" class="crumb ${i === crumbs.length - 1 ? "last" : ""}" data-a="open" data-v="${esc(p)}">${esc(l)}</button>${i && i < crumbs.length - 1 ? `<span class="muted label">/</span>` : ""}`).join("");
  const bar = f.sel.length === 0
    ? `<div class="row">${field("file-filter", "Filter this folder", f.filter, "fileFilter", { style: "flex:1" })}${["Name", "Size", "Date"].map(k => btn(k, "fileSort", { v: k, style: f.sort === k ? "" : "quiet", icon: f.sort === k ? (f.asc ? "arrow_upward" : "arrow_downward") : null })).join("")}${btn("Hidden", "fileHidden", { style: "quiet", icon: f.hidden ? "visibility" : "visibility_off" })}${btn("New folder", "newFolder", { icon: "create_new_folder" })}</div>`
    : `<div class="row"><h4 class="grow" style="padding-left:16px">${f.sel.length} selected</h4>${btn("Copy", "fileCopy", { icon: "content_copy" })}${btn("Cut", "fileCut", { icon: "content_cut" })}${btn("Rename", "fileRename", { icon: "drive_file_rename_outline", disabled: f.sel.length !== 1 })}${btn("Delete", "fileDelete", { style: "danger", icon: "delete" })}${btn("Clear", "fileClear", { style: "quiet", icon: "close" })}</div>`;
  const clip = f.clip ? `<div class="bar"><span class="body-l grow">${f.clip.paths.length} ${f.clip.paths.length === 1 ? "item" : "items"} ${f.clip.cut ? "to move" : "to copy"}. Open the destination, then paste.</span>${btn("Discard", "clipDiscard", { style: "quiet" })}${btn("Paste here", "paste", { style: "primary", icon: "content_paste", disabled: !!f.op })}</div>` : "";
  const op = f.op ? `<div class="bar" id="op-bar">${opBar()}</div>` : "";
  const n = node(f.path);
  let list;
  if (!n || !n.d) list = stateView("error", "Cannot open this folder", "That folder no longer exists.", btn("Go to Internal storage", "open", { v: "/sdcard" }));
  else if (n.denied) list = stateView("error", "Cannot open this folder", "Shell does not have access to this folder.", btn("Try again", "fileRefresh"));
  else {
    const vis = sortEntries(entries(f.path), f.sort, f.asc, f.filter, f.hidden);
    if (!vis.length) list = stateView("folder_off", f.filter.trim() ? "No matches" : "This folder is empty", f.filter.trim() ? `Nothing here matches "${f.filter}".` : "Paste files here, or import an OBB.");
    else list = `<div class="scroll fill" data-s="files:${esc(f.path)}">${vis.map(e => {
      const on = f.sel.includes(e.path);
      return `<div class="frow ${on ? "on" : ""}" data-a="${f.sel.length ? "fileToggle" : "fileOpen"}" data-v="${esc(e.path)}"><button type="button" class="tick ${on ? "on" : ""}" aria-label="Select ${esc(e.name)}" data-a="fileToggle" data-v="${esc(e.path)}"><i>${on ? icon("check") : ""}</i></button>${icon(fileIcon(e))}<span class="body-l grow ell" style="padding-left:8px">${esc(e.name)}</span><span class="muted" style="width:96px;flex:none">${e.isDir ? "" : fmtSize(e.size)}</span><span class="muted" style="width:144px;flex:none">${fmtDate(e.t)}</span></div>`;
    }).join("")}</div>`;
  }
  return `<div class="row16 fill"><div class="box stack8" style="width:224px;flex:none;padding:8px;height:100%">${places.map(([l, p, i]) => `<button type="button" class="place ${f.path === p ? "on" : ""}" data-a="open" data-v="${esc(p)}">${icon(i)}${l}</button>`).join("")}<div class="grow"></div>${btn("Import OBB", "importObb", { style: "primary", icon: "inventory_2", wide: true })}</div>
    <div class="grow stack8" style="height:100%"><div class="crumbs" id="crumbs" data-end>${crumbHtml}</div>${bar}${clip}${op}<div class="box grow">${list}</div></div></div>`;
}

const LIMITS = { eureka: [[72, 90, 120], 5], panther: [[72, 90, 120], 5], hollywood: [[60, 72, 90, 120], 4], seacliff: [[72, 90], 4], monterey: [[60, 72], 4] };
function displayView() {
  const pr = S.props, d = S.disp, [rates, maxL] = LIMITS[pr["ro.product.device"]] || [[60, 72, 90, 120], 5];
  const warning = t => `<div class="warn">${icon("warning")}<span>${esc(t)}</span></div>`;
  const clockWarning = "Raises clock speeds. Only use this if you know the optimal settings for your hardware.";
  const level = (title, desc, prop, opts, unit, warn) => {
    const cur = pr[prop] || "";
    return `<div class="panel">${setting(title, desc, cur ? cur + unit : "Default", `${warn ? warning(warn) : ""}<div class="row"><div class="grow">${choices(opts.map(o => [o, o + unit]), cur, "propSet:" + prop, d.busy)}</div>${btn("Reset", "propReset", { style: "quiet", v: prop, disabled: d.busy || !cur })}</div>`)}</div>`;
  };
  const w = pr[P.w] || "", h = pr[P.h] || "";
  const bad = v => { const n = +v; return !/^\d+$/.test(v) || n < 256 || n > 8192; };
  const texture = `<div class="panel">${setting("Texture resolution", "The size apps render each eye at. Sharper at higher sizes, but heavier on the GPU.", w || h ? `${w} x ${h}` : "Default",
    `<div class="row"><div class="grow">${choices([1024, 1440, 1832, 2048, 2560].map(o => [o, o]), w === h ? w : "", "texSet", d.busy)}</div>${btn("Reset", "texReset", { style: "quiet", disabled: d.busy || (!w && !h) })}</div>
    <div class="row">${field("tex-w", "Custom width", d.cw, "texW", { style: "flex:1", num: true, bad: d.cw && bad(d.cw) })}${field("tex-h", "Custom height", d.ch, "texH", { style: "flex:1", num: true, bad: d.ch && bad(d.ch) })}${btn("Apply size", "texApply", { disabled: d.busy || bad(d.cw) || bad(d.ch) })}</div>`)}</div>`;
  const levels = Array.from({ length: maxL + 1 }, (_, i) => i);
  const summary = p => [p.values[P.refresh] && `${p.values[P.refresh]} Hz`, p.values[P.w] && `${p.values[P.w]}x${p.values[P.h] || ""}`, p.values[P.ffr] && `FFR ${p.values[P.ffr]}`, p.values[P.cpu] && `CPU ${p.values[P.cpu]}`, p.values[P.gpu] && `GPU ${p.values[P.gpu]}`].filter(Boolean).join(", ") || "All defaults";
  return `<div class="row16 fill"><div class="grow stack scroll" style="height:100%" data-s="disp">
    <div class="body-l muted">These values reset when the headset reboots. Apps read them at launch, so restart a game after changing them.</div>
    ${warning("Only use these if you know the optimal settings for your hardware. Wrong values can cause overheating, throttling and crashes.")}
    ${level("Refresh rate", "How many times per second the display updates. Higher is smoother and uses more battery.", P.refresh, rates, " Hz")}
    ${texture}
    ${level("Fixed foveated rendering", "Lowers detail at the edges of the view to save GPU power. 0 is off, 4 is strongest.", P.ffr, [0, 1, 2, 3, 4], "")}
    ${level("CPU level", "The CPU clock floor. Higher levels run hotter and drain the battery faster.", P.cpu, levels, "", clockWarning)}
    ${level("GPU level", "The GPU clock floor. Higher levels run hotter and drain the battery faster.", P.gpu, levels, "", clockWarning)}</div>
    <div class="panel" style="width:320px;flex:none;height:100%"><h3>Profiles</h3><div class="grow stack scroll" data-s="profiles">
    ${S.profiles.length ? S.profiles.map((p, i) => `<div class="stack8"><h4>${esc(p.name)}</h4><div class="muted">${esc(summary(p))}</div><div class="row">${btn("Apply", "profApply", { style: "primary", v: i, disabled: d.busy })}${btn("Delete", "profDelete", { style: "quiet", v: i })}</div></div>`).join("") : `<div class="body-l muted">No profiles yet. Set the values you want, then save them here to apply them in one step.</div>`}</div>
    ${btn("Save current values", "profSave", { icon: "bookmark_add", wide: true })}${btn("Reset everything", "resetAll", { style: "danger", icon: "restart_alt", wide: true, disabled: d.busy })}</div></div>`;
}

    : stateView("touch_app", "Select an app", "Its actions show up here.");
  return `<div class="row16 fill"><div class="grow stack8" style="height:100%"><div class="row">${field("app-q", "Search apps", a.q, "appQ", { style: "flex:1" })}${btn("System apps", "appSys", { style: "quiet", icon: a.sys ? "check_box" : "check_box_outline_blank" })}</div><div class="box grow">${list}</div>${btn(a.step || "Install APK and OBB", "installOpen", { style: "primary", icon: "install_mobile", wide: true, loading: !!a.step })}</div>
    <div class="box" style="width:440px;flex:none;height:100%">${detail}</div></div>`;

const LEVELS = ["Verbose", "Debug", "Info", "Warning", "Error"];
const logVisible = () => { const l = S.util.log; return l.lines.filter(e => LEVELS.indexOf(e.level) >= LEVELS.indexOf(l.level) && (!l.tag.trim() || e.tag.toLowerCase().includes(l.tag.trim().toLowerCase()))); };
const logHtml = () => logVisible().map(e => `<div class="${e.level === "Error" ? "e" : ""}">${esc(e.raw)}</div>`).join("");

/* ---------- Dot web background: same behaviour as DotWebBackdrop.kt ---------- */
(function dotWeb() {
  const panel = document.getElementById("panel"), canvas = document.getElementById("web"), ctx = canvas.getContext("2d");
  const ratio = Math.min(2, window.devicePixelRatio || 1), W = 1280, H = 800, SPACING = 56, REACH = 176, LINK = 96, PULL = .14;
  const stillMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  canvas.width = W * ratio; canvas.height = H * ratio;
  let seed = 7;
  const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const dots = [];
  for (let y = 0; y < H / SPACING + 1; y++) for (let x = 0; x < W / SPACING + 1; x++) {
    dots.push([(x + .5) * SPACING + (rand() - .5) * SPACING * .7, (y + .5) * SPACING + (rand() - .5) * SPACING * .7]);
  }
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  let target = null, px = 0, py = 0, strength = 0, running = false;
  function draw() {
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const near = [];
    for (const [x, y] of dots) {
      const close = Math.max(0, 1 - Math.hypot(x - px, y - py) / REACH) * strength;
      const dx = x + (px - x) * close * PULL, dy = y + (py - y) * close * PULL;
      const [r, g, b] = mix([68, 51, 97], [155, 92, 246], close);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.beginPath(); ctx.arc(dx, dy, 1.5 * (1 + close), 0, 6.2832); ctx.fill();
      if (close > 0) near.push([dx, dy, close]);
    }
    ctx.lineWidth = 1;
    const line = (x1, y1, x2, y2, a) => { ctx.strokeStyle = `rgba(155,92,246,${a})`; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
    near.forEach(([x, y, c], i) => {
      line(px, py, x, y, c * .45);
      for (let j = i + 1; j < near.length; j++) {
        const gap = Math.hypot(x - near[j][0], y - near[j][1]);
        if (gap < LINK) line(x, y, near[j][0], near[j][1], Math.min(c, near[j][2]) * (1 - gap / LINK));
      }
    });
  }
  function frame() {
    const want = target ? 1 : 0;
    if (target) {
      px += (target[0] - px) * (stillMotion ? 1 : .2); py += (target[1] - py) * (stillMotion ? 1 : .2);
      if (Math.hypot(target[0] - px, target[1] - py) < .5) { px = target[0]; py = target[1]; }
    }
    strength += (want - strength) * (stillMotion ? 1 : .12);
    if (Math.abs(want - strength) < .01) strength = want;
    draw();
    if (strength === want && (!target || (px === target[0] && py === target[1]))) { running = false; return; }
    requestAnimationFrame(frame);
  }
  function moveTo(next) {
    if (next && strength === 0) { px = next[0]; py = next[1]; }
    target = next;
    if (!running) { running = true; requestAnimationFrame(frame); }
  }
  panel.addEventListener("pointermove", e => { const r = panel.getBoundingClientRect(); moveTo([(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]); });
  panel.addEventListener("pointerleave", () => moveTo(null));
  panel.addEventListener("pointerup", e => { if (e.pointerType === "touch") moveTo(null); });
  draw();
})();

/* ---------- Terminal simulation ---------- */
function tOut(t, k = "") { const l = S.term.lines; l.push({ t, k }); if (l.length > 5000) l.shift(); }
let termTimer = null;
function termResolve(p) {
  const raw = p.startsWith("/") ? p : join(S.term.cwd, p), out = [];
  for (const s of raw.split("/")) { if (!s || s === ".") continue; if (s === "..") out.pop(); else out.push(s); }
  return "/" + out.join("/");
}
function termRun(raw) {
  const t = S.term, cmd = raw.trim();
  if (!cmd || t.running) return;
  t.history = [cmd, ...t.history.filter(h => h !== cmd)].slice(0, 200);
  t.idx = -1; t.input = "";
  tOut(`${t.cwd} $ ${cmd}`, "cmd");
  const parts = (cmd.match(/"[^"]*"|'[^']*'|\S+/g) || []).map(s => s.replace(/^["']|["']$/g, ""));
  const [c, ...a] = parts;
  const exit = n => tOut(`Exited with code ${n}.`, "status");
  const stream = (lines, ms) => {
    t.running = true; let i = 0;
    termTimer = setInterval(() => {
      if (lines && i >= lines.length) { clearInterval(termTimer); t.running = false; render(); return; }
      if (lines) tOut(lines[i++]); else tOut(fakeLog().raw);
      updateTerm();
    }, ms);
  };
  switch (c) {
    case "clear": t.lines = []; break;
    case "pwd": tOut(t.cwd); break;
    case "whoami": tOut("shell"); break;
    case "id": tOut("uid=2000(shell) gid=2000(shell) groups=2000(shell),1004(input),1007(log),1011(adb),1015(sdcard_rw),3003(inet)"); break;
    case "echo": tOut(a.join(" ")); break;
    case "su": tOut("/system/bin/sh: su: inaccessible or not found"); exit(127); break;
    case "cd": {
      const p = termResolve(a[0] || "/sdcard"), n = node(p);
      if (!n) { tOut(`cd: ${a[0]}: No such file or directory`); exit(2); }
      else if (!n.d) { tOut(`cd: ${a[0]}: Not a directory`); exit(2); }
      else if (n.denied) { tOut(`cd: ${a[0]}: Permission denied`); exit(2); }
      else t.cwd = p;
      break;
    }
    case "ls": {
      const showAll = a.includes("-a") || a.includes("-la") || a.includes("-al"), long = a.includes("-l") || a.includes("-la") || a.includes("-al");
      const target = a.find(x => !x.startsWith("-")), p = termResolve(target || "."), n = node(p);
      if (!n) { tOut(`ls: ${target}: No such file or directory`); exit(1); break; }
      if (n.denied) { tOut(`ls: ${target || p}: Permission denied`); exit(1); break; }
      if (!n.d) { tOut(target); break; }
      sortEntries(entries(p), "Name", true, "", showAll).forEach(e => tOut(long ? `${e.isDir ? "drwxrwx--x" : "-rw-rw----"} 2 root sdcard_rw ${String(e.size).padStart(11)} ${fmtDate(e.t)} ${e.name}` : e.name));
      break;
    }
    case "cat": {
      const p = termResolve(a[0] || ""), n = node(p);
      if (!a[0]) { tOut("cat: missing file"); exit(1); }
      else if (!n) { tOut(`cat: ${a[0]}: No such file or directory`); exit(1); }
      else if (n.denied) { tOut(`cat: ${a[0]}: Permission denied`); exit(1); }
      else if (n.d) { tOut(`cat: ${a[0]}: Is a directory`); exit(1); }
      else tOut("(file contents are not simulated)", "status");
      break;
    }
    case "mkdir": {
      const name = a.find(x => !x.startsWith("-"));
      if (!name) { tOut("mkdir: Needs 1 argument"); exit(1); break; }
      const p = termResolve(name);
      if (p.startsWith("/sdcard")) ensureDir(p); else { tOut(`mkdir: '${name}': Permission denied`); exit(1); }
      break;
    }
    case "rm": {
      const name = a.find(x => !x.startsWith("-") ), p = name && termResolve(name), n = p && node(p);
      if (!n) { tOut(`rm: ${name || "missing operand"}: No such file or directory`); exit(1); }
      else if (PROTECTED.has(p) || !p.startsWith("/sdcard")) { tOut(`rm: ${name}: Permission denied`); exit(1); }
      else if (n.d && !a.some(x => /r/.test(x) && x.startsWith("-"))) { tOut(`rm: ${name}: Is a directory`); exit(1); }
      else removePath(p);
      break;
    }
    case "getprop":
      if (a[0]) tOut(S.props[a[0]] || "");
      else Object.keys(S.props).sort().forEach(k => tOut(`[${k}]: [${S.props[k]}]`));
      break;
    case "setprop":
      if (a.length < 1) { tOut("usage: setprop NAME VALUE"); exit(1); }
      else if (a[0].startsWith("ro.")) { tOut(`Failed to set property '${a[0]}' to '${a[1] || ""}'`); exit(1); }
      else S.props[a[0]] = a[1] || "";
      break;
    case "pm":
      if (a[0] === "list" && a[1] === "packages") S.apps.list.filter(x => a[2] !== "-3" || !x.sys).forEach(x => tOut(`package:${x.pkg}`));
      else { tOut("Only 'pm list packages' is simulated. Use the Apps screen for the rest.", "status"); }
      break;
    case "df": tOut("Filesystem      Size  Used Avail Use% Mounted on"); tOut("/dev/fuse       108G   41G   67G  38% /storage/emulated"); break;
    case "dumpsys":
      if (a[0] === "battery") ["Current Battery Service state:", "  AC powered: false", "  USB powered: false", "  status: 3", "  health: 2", `  level: ${S.util.bat}`, "  voltage: 4012", "  temperature: 312"].forEach(l => tOut(l));
      else tOut(`Only 'dumpsys battery' is simulated.`, "status");
      break;
    case "reboot": doReboot(a[0] ? `Reboot to ${a[0]}` : "Reboot"); tOut("The shell connection closed.", "status"); break;
    case "sleep": stream(Array(Math.max(0, Math.min(+a[0] || 1, 30))).fill("").map((_, i) => `(sleeping ${i + 1})`), 1000); break;
    case "logcat": stream(null, 500); break;
    default: tOut(`/system/bin/sh: ${c}: inaccessible or not found`); exit(127);
  }
  render();
}
function updateTerm() {
  const el = document.getElementById("term-out");
  if (el) { el.innerHTML = termOutput(); el.scrollTop = el.scrollHeight; }
}

/* ---------- Logcat simulation ---------- */
const LOG = [["I", "VrApi", () => `FPS=${70 + Math.floor(Math.random() * 3)},Prd=45ms,Tear=0,Early=0,Stale=${Math.floor(Math.random() * 3)},CPU4/GPU=${S.props[P.cpu] || 3}/${S.props[P.gpu] || 3},GPU%=0.${60 + Math.floor(Math.random() * 30)}`], ["I", "VrApi", () => "Compositor frame submitted"], ["D", "OVRPlugin", () => "Boundary state unchanged"], ["D", "AudioFlinger", () => "mixer(0xb400) throttle end"], ["W", "OVRPlugin", () => "Compositor layer fell back to low quality"], ["I", "ActivityManager", () => "Start proc for service com.oculus.vrshell"], ["E", "Unity", () => "NullReferenceException in PlayerController"], ["V", "InputDispatcher", () => "Delivering controller event"]];
const LV = { V: "Verbose", D: "Debug", I: "Info", W: "Warning", E: "Error" };
function fakeLog() {
  const pick = Math.random() < .55 ? LOG[0] : LOG[Math.floor(Math.random() * LOG.length)], d = new Date(), z = (n, l = 2) => String(n).padStart(l, "0");
  const raw = `${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}.${z(d.getMilliseconds(), 3)}  ${1000 + Math.floor(Math.random() * 3000)}  ${1000 + Math.floor(Math.random() * 3000)} ${pick[0]} ${pick[1].padEnd(8)}: ${pick[2]()}`;
  return { raw, level: LV[pick[0]], tag: pick[1] };
}
for (let i = 0; i < 14; i++) S.util.log.lines.push(fakeLog());
setInterval(() => {
  const l = S.util.log;
  if (!l.running || l.paused || !up()) return;
  const was = logVisible().length;
  l.lines.push(fakeLog());
  if (l.lines.length > 5000) l.lines.shift();
  if (S.dest === "Utilities" && S.util.tab === "Logcat" && !S.setup) {
    const out = document.getElementById("log-out");
    if (!out || !was) { if (logVisible().length) render(); }
    else { out.innerHTML = logHtml(); out.scrollTop = out.scrollHeight; }
  }
}, 900);

/* ---------- Actions ---------- */
function doReboot(mode) {
  S.busy.reboot = mode === "Reboot";
  render();
  later(700, () => {
    S.busy.reboot = false; ok("Rebooting."); S.adbUp = false; S.bytezukuUp = false;
    S.home.prox = false;
    Object.values(P).forEach(p => { S.props[p] = ""; });
    S.util.tw.capture = "";
    setTimeout(() => { if (S.paired && S.pref !== "ByteZuku") { S.adbUp = true; ok("Reconnected after reboot. Display values were reset."); } }, 4500);
  });
}
function reconnect() {
  const useAdb = S.pref !== "ByteZuku", useSz = S.pref !== "Adb";
  S.connecting = true; render();
  later(900, () => {
    S.connecting = false;
    if (useSz && S.bytezuku === "Ready") { S.bytezukuUp = true; ok("Connected."); }
    else if (useAdb && S.paired) { S.adbUp = true; ok("Connected."); }
    else fail(useAdb ? "This headset has not been paired yet." : "No shell connection. Open Settings to connect.");
  });
}
function goFiles(path) { S.files.path = path; S.files.sel = []; S.files.filter = ""; S.dest = "Files"; }
function fileOp(label, done, ms, withProgress, finish) {
  const f = S.files;
  const op = { label, progress: withProgress ? 0 : null, cancelled: false };
  f.op = op; render();
  const started = Date.now();
  const tick = setInterval(() => {
    if (op.cancelled) { clearInterval(tick); return; }
    const p = (Date.now() - started) / ms;
    if (withProgress) { op.progress = Math.min(1, p); const el = document.getElementById("op-bar"); if (el) el.querySelector(".track i").style.width = `${op.progress * 100}%`, el.querySelector(".label").textContent = `${label} ${Math.floor(op.progress * 100)}%`; }
    if (p >= 1) { clearInterval(tick); finish(); f.op = null; ok(done); }
  }, 100);
  op.tick = tick;
}
function pasteTargets(paths, dest) { return paths.map(p => [p, join(dest, parent(p) === dest ? copyName(base(p)) : base(p))]); }
function doPaste() {
  const f = S.files, clip = f.clip, dest = f.path, n = clip.paths.length, word = n === 1 ? "1 item" : `${n} items`;
  if (clip.cut) {
    fileOp("Moving", `Pasted ${word}.`, 600, false, () => {
      clip.paths.filter(p => parent(p) !== dest).forEach(p => { const x = node(p); if (x) { placeAt(join(dest, base(p)), x); removePath(p); } });
      f.clip = null;
    });
  } else {
    fileOp("Copying", `Pasted ${word}.`, 3200, true, () => { pasteTargets(clip.paths, dest).forEach(([from, to]) => { const x = node(from); if (x) { placeAt(to, { ...clone(x), t: Math.floor(Date.now() / 1000) }); } }); });
  }
}
function act(key, done, ms, fn) {
  S.apps.busy = key; render();
  later(ms, () => { S.apps.busy = null; if (fn) fn(); ok(done); });
}
function setProps(changes, done) {
  S.disp.busy = true; render();
  later(350, () => { Object.assign(S.props, changes); S.disp.busy = false; ok(done); });
}
function saveFile(folder, name, size) { ensureDir(folder).c[name] = file(size, Math.floor(Date.now() / 1000)); return join(folder, name); }
let recTimer;
function stopRec() {
  clearTimeout(recTimer);
  S.util.rec = false;
  S.util.last = saveFile("/sdcard/Pasteularity/recordings", `recording-${stamp()}.mp4`, 48 * MB);
  ok("Recording saved.");
}
const appSel = () => S.apps.list.find(x => x.pkg === S.apps.sel);
const topDlg = () => S.dialogs[S.dialogs.length - 1];
const closeDlg = () => { S.dialogs.pop(); render(); };

const A = {
  go(v) { S.dest = v; render(); },

  open(v) { S.files.path = v; S.files.sel = []; S.files.filter = ""; render(); },
  fileOpen(v) { const n = node(v); if (n && n.d) A.open(v); },
  fileToggle(v) { const f = S.files; f.sel = f.sel.includes(v) ? f.sel.filter(x => x !== v) : [...f.sel, v]; render(); },
  fileSort(v) { const f = S.files; if (f.sort === v) f.asc = !f.asc; else { f.sort = v; f.asc = true; } render(); },
  fileHidden() { S.files.hidden = !S.files.hidden; render(); },
  fileRefresh() { render(); },
  fileClear() { S.files.sel = []; render(); },

  fileCut() { const f = S.files; f.clip = { paths: f.sel, cut: true }; f.sel = []; render(); },
  clipDiscard() { S.files.clip = null; render(); },
  newFolder() { inputDlg("New folder", "Folder name", "Create", name => { if (!S.files.path.startsWith("/sdcard")) { fail("mkdir: Permission denied"); return; } ensureDir(join(S.files.path, name)); ok("Folder created."); }, "", validName); },
  fileRename() { const p = S.files.sel[0]; inputDlg("Rename", "New name", "Rename", name => { if (PROTECTED.has(p)) { fail("That folder is protected and cannot be changed."); return; } placeAt(join(parent(p), name), node(p)); if (name !== base(p)) removePath(p); S.files.sel = []; ok("Renamed."); }, base(p), validName); },
  fileDelete() {
    const sel = S.files.sel, names = sel.slice(0, 5).map(base).join("\n") + (sel.length > 5 ? `\nand ${sel.length - 5} more` : "") + "\n\nThis cannot be undone.";
    confirmDlg(`Delete ${sel.length} ${sel.length === 1 ? "item" : "items"}?`, names, "Delete", () => {
      if (sel.some(p => PROTECTED.has(p))) { fail("That folder is protected and cannot be changed."); return; }
      fileOp("Deleting", `Deleted ${sel.length === 1 ? "1 item" : `${sel.length} items`}.`, 500, false, () => { sel.forEach(removePath); S.files.sel = []; });
    });
  },
  paste() {
    const f = S.files, clip = f.clip, dest = f.path;
    if (clip.paths.some(p => dest === p || dest.startsWith(p + "/"))) { fail("A folder cannot be pasted into itself."); return; }
    if (clip.cut && clip.paths.every(p => parent(p) === dest)) { fail("Those items are already in this folder."); return; }
    const targets = clip.cut ? clip.paths.map(p => join(dest, base(p))).filter(p => !clip.paths.includes(p)) : pasteTargets(clip.paths, dest).map(x => x[1]);
    const clash = targets.filter(p => node(p));
    if (clash.length) confirmDlg(`Replace ${clash.length} ${clash.length === 1 ? "item" : "items"}?`, clash.slice(0, 5).map(base).join("\n") + "\n\nThese already exist in this folder.", "Replace", doPaste);
    else doPaste();
  },
  opCancel() { const op = S.files.op; if (op) { op.cancelled = true; clearInterval(op.tick); S.files.op = null; fail("Cancelled. Files already written were kept."); } },
  importObb() {
    pickerDlg("Choose OBB files", DL, { ext: ["obb"], multi: true }, picked => {
      S.dialogs.push({ type: "obb", sources: picked, pkg: picked.map(p => obbPkg(base(p))).find(Boolean) || "" });
    });
  },
  obbMatch(v) { topDlg().pkg = v; render(); },
  obbImport() {
    const d = topDlg(), folder = join(OBB, d.pkg.trim());
    S.dialogs.pop(); S.dest = "Files";
    fileOp("Importing OBB", `Imported to ${folder}.`, 3000, true, () => { const dst = ensureDir(folder); d.sources.forEach(p => { const n = node(p); if (n) dst.c[base(p)] = clone(n); }); });
  },
  /* Picker */
  pickOpen(v) { const d = topDlg(); d.path = v; d.picked = []; render(); },
  pickUp() { const d = topDlg(); const up = parent(d.path); if (up) { d.path = up; d.picked = []; render(); } },
  pickToggle(v) { const d = topDlg(); d.picked = d.picked.includes(v) ? d.picked.filter(x => x !== v) : d.multi ? [...d.picked, v] : [v]; render(); },
  pickUse() { const d = S.dialogs.pop(); d.onPick(d.folder ? [d.path] : d.picked); render(); },
  /* Display */
  propReset(v) { setProps({ [v]: "" }, "Reset to default."); },
  texSet(v) { setProps({ [P.w]: v, [P.h]: v }, "Texture size applied."); },
  texReset() { setProps({ [P.w]: "", [P.h]: "" }, "Reset to default."); },
  texApply() { setProps({ [P.w]: S.disp.cw, [P.h]: S.disp.ch }, "Texture size applied."); },
  resetAll() { confirmDlg("Reset all display settings?", "Every value on this screen goes back to the system default.", "Reset", () => setProps(Object.fromEntries(Object.values(P).map(p => [p, ""])), "All display settings reset.")); },
  profSave() { inputDlg("Save profile", "Name", "Save", name => { const values = Object.fromEntries(Object.values(P).filter(p => S.props[p]).map(p => [p, S.props[p]])); S.profiles = [...S.profiles.filter(x => x.name !== name), { name, values }]; ok("Profile saved."); }); },
  profApply(v) { const pf = S.profiles[+v]; setProps(Object.fromEntries(Object.values(P).map(p => [p, pf.values[p] || ""])), `Applied ${pf.name}.`); },
  profDelete(v) { const pf = S.profiles[+v]; confirmDlg(`Delete ${pf.name}?`, "This only removes the saved profile. Current values do not change.", "Delete", () => { S.profiles = S.profiles.filter(x => x !== pf); render(); }); },
  /* Apps */
  appSys() { S.apps.sys = !S.apps.sys; render(); },
  appSel(v) { S.apps.sel = v; render(); },
  appAct(v) {
    const app = appSel();

  },

    if (v === "uninstall") confirmDlg(`Uninstall ${app.label}?`, "The app and its data are removed from this headset.", "Uninstall", () => act("uninstall", `Uninstalled ${app.label}.`, 900, () => { S.apps.list = S.apps.list.filter(x => x !== app); S.apps.sel = null; removePath(join(DATA, app.pkg)); removePath(join(OBB, app.pkg)); }));
  },
  installOpen() { if (S.apps.step) return; S.dialogs.push({ type: "install", apk: null, obb: null }); render(); },
  instApk() { const d = topDlg(); pickerDlg("Choose an APK", DL, { ext: ["apk"], multi: false }, p => { d.apk = p[0]; }); },
  instObb() { const d = topDlg(); pickerDlg("Choose the OBB folder", DL, { folder: true }, p => { d.obb = p[0]; }); },
  instGo() {
    const { apk, obb } = S.dialogs.pop(), name = base(apk).replace(/\.apk$/i, ""), pkg = name === "TrackRacer" ? "com.example.racer" : `com.sideloaded.${name.toLowerCase().replace(/[^a-z0-9]/g, "")}`;
    const steps = [obb && "Reading APK", "Installing", obb && "Copying OBB"].filter(Boolean);
    let i = 0;

      S.apps.step = null;

      S.apps.list = [...S.apps.list.filter(x => x.pkg !== pkg), { pkg, label: name.replace(/([a-z])([A-Z])/g, "$1 $2"), ver: "1402", sys: false }];

  /* Utilities */

const refreshAfterInput = () => render();

app.addEventListener("click", e => {
  const t = e.target.closest("[data-a]");
  if (!t || t.disabled) return;
  const name = t.dataset.a, v = t.dataset.v;
  if (name.includes(":")) { const [k, arg] = name.split(":"); prefixed[k](arg, v); return; }
  A[name](v, t);
});
app.addEventListener("input", e => { const k = e.target.dataset.i; if (k) inputs[k](e.target.value, e.target); });
app.addEventListener("keydown", e => {
  const k = e.target.dataset && e.target.dataset.i;
  if (!k) return;
  if (k === "termInput") {
    if (e.key === "Enter") { e.preventDefault(); termRun(S.term.input); }
    if (e.key === "ArrowUp") { e.preventDefault(); A.histPrev(); }
    if (e.key === "ArrowDown") { e.preventDefault(); A.histNext(); }
  }
  if (k === "dlgInput" && e.key === "Enter") { const d = topDlg(); if (d.value.trim() && !d.validate(d.value)) { e.preventDefault(); A.dlgOk(); } }
  if (k === "onbCode" && e.key === "Enter" && S.onb.code.length === 6 && S.onb.port && !S.onb.pairing) { e.preventDefault(); A.onbPair(); }
});
document.querySelector(".sim-tools").addEventListener("click", e => {
  const k = e.target.dataset && e.target.dataset.sim;
  if (k === "disconnect") { S.adbUp = false; S.bytezukuUp = false; fail("The shell connection closed."); }
  if (k === "unpair") { S.paired = false; S.adbUp = false; S.bytezukuUp = false; S.dialogs = []; fail("Pairing reset. The chip now offers setup."); }
  if (k === "setup") { S.paired = false; S.adbUp = false; S.bytezukuUp = false; S.dialogs = []; S.setup = true; S.onb = { step: 0, code: "", port: "", detected: false, pairing: false, error: null }; render(); }
  if (k === "bytezuku") { S.bytezuku = S.bytezuku === "NotRunning" ? "NeedsPermission" : S.bytezuku; ok("ByteZuku is running."); }
});

fit();
render();
